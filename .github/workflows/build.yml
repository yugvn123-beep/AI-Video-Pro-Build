name: Build AI Video Pro

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Extract source
        run: unzip -q AI-Video-Pro-v1-source.zip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK and AAB
        run: gradle -p AI-Video-Pro assembleDebug bundleRelease

      - name: Upload APK and AAB
        uses: actions/upload-artifact@v4
        with:
          name: AI-Video-Pro-builds
          path: |
            AI-Video-Pro/app/build/outputs/apk/debug/app-debug.apk
            AI-Video-Pro/app/build/outputs/bundle/release/app-release.aab
